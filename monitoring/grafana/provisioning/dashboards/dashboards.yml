# =============================================================================
# Grafana Dashboard Provisioning
# =============================================================================
# Auto-loads dashboard JSON files from the provisioned directory.
# =============================================================================

apiVersion: 1

providers:
  - name: "Default"
    orgId: 1
    folder: "Distributed Logging System"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
