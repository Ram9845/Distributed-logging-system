# =============================================================================
# Prometheus Configuration
# =============================================================================
# Scrape configuration for the Distributed Logging & Monitoring System.
# Targets: FastAPI, Kafka Exporter, Node Exporter, Consumer, Producer.
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Alert rules
rule_files:
  - "alert_rules.yml"

# Scrape targets
scrape_configs:
  # ---- FastAPI Application ----
  - job_name: "fastapi"
    metrics_path: "/metrics"
    scrape_interval: 10s
    static_configs:
      - targets: ["fastapi:8000"]
        labels:
          service: "fastapi"
          environment: "production"

  # ---- Kafka Exporter ----
  - job_name: "kafka-exporter"
    scrape_interval: 15s
    static_configs:
      - targets: ["kafka-exporter:9308"]
        labels:
          service: "kafka"
          environment: "production"

  # ---- Node Exporter (System Metrics) ----
  - job_name: "node-exporter"
    scrape_interval: 15s
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: "node"
          environment: "production"

  # ---- Log Consumer ----
  - job_name: "log-consumer"
    scrape_interval: 10s
    static_configs:
      - targets: ["consumer:8001"]
        labels:
          service: "consumer"
          environment: "production"

  # ---- Log Producer ----
  - job_name: "log-producer"
    scrape_interval: 10s
    static_configs:
      - targets: ["producer:8002"]
        labels:
          service: "producer"
          environment: "production"

  # ---- Prometheus Self-Monitoring ----
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
